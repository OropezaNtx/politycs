services:

  postgres:
    image: postgres:16
    container_name: politycs_postgres
    restart: always

    environment:
      POSTGRES_USER: politycs
      POSTGRES_PASSWORD: politycs_password
      POSTGRES_DB: politycs_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: politycs_pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data: